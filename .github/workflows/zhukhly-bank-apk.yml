name: Zhukhly Bank APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ZhukhlyBank/**'
      - '.github/workflows/zhukhly-bank-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: ZhukhlyBank
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZhukhlyBank-debug-apk
          path: ZhukhlyBank/app/build/outputs/apk/debug/app-debug.apk
