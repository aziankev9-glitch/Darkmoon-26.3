name: Zhukhly Bank APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ZhukhlyBank/**'
      - '.github/workflows/zhukhly-bank-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Install Android SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key from repository secret
        env:
          SIGNING_KEY_B64: ${{ secrets.ZHUKHLY_SIGNING_KEY_B64 }}
        run: |
          if [ -z "$SIGNING_KEY_B64" ]; then
            echo "::error::Missing ZHUKHLY_SIGNING_KEY_B64. Configure a persistent signing key before publishing an APK."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$SIGNING_KEY_B64" | base64 -d > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Print signing certificate fingerprint
        run: keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep SHA256
      - name: Build APK
        working-directory: ZhukhlyBank
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ZhukhlyBank-debug-apk
          path: ZhukhlyBank/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish versioned GitHub Release
        if: github.event_name == 'push' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" ZhukhlyBank/app/build.gradle | head -1)
          TAG="v${VERSION}"
          cp ZhukhlyBank/app/build/outputs/apk/debug/app-debug.apk "ZhukhlyBank-${VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "ZhukhlyBank-${VERSION}.apk" --clobber
          else
            gh release create "$TAG" "ZhukhlyBank-${VERSION}.apk" --target "$GITHUB_SHA" --title "Жухлый Банк ${VERSION}" --notes "Обновление демонстрационного приложения Жухлый Банк. Новые возможности и исправления."
          fi
