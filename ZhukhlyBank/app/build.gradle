plugins { id 'com.android.application' }
android {
 namespace 'ru.zhukhly.bank'
 compileSdk 35
 signingConfigs {
  demo {
   storeFile file('demo-signing.jks')
   storePassword 'demoOnly123'
   keyAlias 'zhukhlydemo'
   keyPassword 'demoOnly123'
  }
 }
 buildTypes { debug { signingConfig signingConfigs.demo } }
 defaultConfig { applicationId 'ru.zhukhly.bank'; minSdk 26; targetSdk 35; versionCode 58; versionName '5.8' }
}

dependencies {
 implementation 'androidx.core:core:1.13.1'
 implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
